<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8fd;--card:#fff;--ink:#0c1d2c;--mut:#5b6672;--line:#dbe5f0;--pri:#0a2a43;--teal:#00809e;--cy:#19c6e6;--soft:#e8f2ff;--red:#d32f2f;--redS:#fde7e5;--amb:#e8a317;--ambS:#fff3d6;--grn:#119a64;--grnS:#dff5ea;--sh:0 1px 2px #0a2a4310,0 6px 20px #0a2a4309}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#08131e;--card:#0f2132;--ink:#e6f0fa;--mut:#8fa3b6;--line:#1d3349;--pri:#19c6e6;--teal:#4cc9e4;--soft:#13304a;--redS:#3a1819;--ambS:#38300f;--grnS:#0e3324;--sh:none}}
:root[data-t=dark]{--bg:#08131e;--card:#0f2132;--ink:#e6f0fa;--mut:#8fa3b6;--line:#1d3349;--pri:#19c6e6;--teal:#4cc9e4;--soft:#13304a;--redS:#3a1819;--ambS:#38300f;--grnS:#0e3324;--sh:none}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;-webkit-font-smoothing:antialiased}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;font-weight:400;vertical-align:middle;font-feature-settings:'liga';display:inline-block;width:1em;overflow:hidden;white-space:nowrap}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
aside{width:248px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;z-index:30;transition:transform .25s}
.logo{display:flex;gap:10px;align-items:center;padding:0 6px 18px;cursor:pointer}
.logo b{font-size:21px;letter-spacing:.5px;font-weight:800;line-height:1}.logo b i{font-style:normal;color:var(--teal)}.logo small{display:block;font-size:10px;color:var(--mut);letter-spacing:.3px;margin-top:3px}
.logo svg{filter:drop-shadow(0 4px 8px #19c6e644);transition:transform .5s}.logo:hover svg{transform:rotate(-8deg) scale(1.08)}
.wv{animation:wv 3s ease-in-out infinite}@keyframes wv{50%{transform:translateX(-3px)}}
nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:12px;color:var(--mut);font-weight:600;cursor:pointer;margin-bottom:3px;position:relative;transition:.2s}
nav a:hover{background:var(--soft);color:var(--ink);transform:translateX(3px)}
nav a.on{background:linear-gradient(135deg,#0a2a43,#0d4a6b);color:#fff;box-shadow:0 6px 16px #0a2a4340}
.who{margin-top:auto;background:var(--soft);border-radius:14px;padding:11px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.who small{display:block;color:var(--teal);font-weight:700;font-size:11px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:12px 28px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 11px;border-radius:99px;background:var(--soft);color:var(--teal);font-size:12px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grn);animation:pl 1.8s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 #119a6466}100%{box-shadow:0 0 0 8px #0000}}
.sp{flex:1}.ib{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;position:relative}
.ib em{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font:700 10px/16px sans-serif;min-width:16px;text-align:center;border-radius:9px}
select,input[type=text],input[type=date],input[type=time],input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:0;max-width:100%}
select:focus,input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #00809e22}
#v{padding:6px 28px 40px;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.4px}h2{font-size:16px;font-weight:700}
.sub{color:var(--mut);max-width:720px;margin:4px 0}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin:12px 0 18px}
.g{display:grid;gap:16px}.c4{grid-template-columns:repeat(4,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:1fr 1fr}.m{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh);border:1px solid var(--line);transition:.25s;min-width:0}
.hv:hover{transform:translateY(-3px);box-shadow:0 12px 28px #0a2a431a}
.lbl{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--mut);text-transform:uppercase}
.big{font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.tag{display:inline-block;padding:2px 9px;border-radius:7px;font-size:11px;font-weight:700;background:var(--soft);color:var(--teal)}
.tag.r{background:var(--redS);color:var(--red)}.tag.a{background:var(--ambS);color:#a56d00}.tag.n{background:var(--grnS);color:var(--grn)}
.btn{padding:9px 16px;border-radius:11px;font-weight:700;background:var(--soft);color:var(--teal);transition:.2s;display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(.95);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,#0a2a43,#0d4a6b);color:#fff}.btn.d{background:var(--red);color:#fff}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}.seg button{padding:6px 13px;border-radius:9px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.meter{height:7px;border-radius:9px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.it{padding:12px;border-radius:12px;background:var(--soft);border-left:4px solid var(--teal);margin-bottom:10px;cursor:pointer;transition:.2s}.it:hover{transform:translateX(4px)}.it.r{border-color:var(--red)}.it.a{border-color:var(--amb)}
svg text{font-family:inherit}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);padding:10px;background:var(--soft)}td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr{transition:.15s}tbody tr:hover{background:var(--soft)}
.mono{font-family:'JetBrains Mono',monospace;font-weight:500}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{padding:10px 14px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}.tabs button.on{color:var(--teal);border-color:var(--teal)}
.sw{width:44px;height:25px;border-radius:99px;background:#9bb0c2;position:relative;flex:none;transition:.25s}.sw:after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.25s}.sw.on{background:var(--teal)}.sw.on:after{left:22px}
input[type=range]{width:100%;accent-color:var(--teal)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal>div{min-height:84px;border-radius:10px;border:1px solid var(--line);padding:5px;font-weight:600;cursor:pointer;min-width:0;transition:.15s}.cal>div:hover{border-color:var(--teal);background:var(--soft)}.cal .h{min-height:0;border:0;background:none;text-align:center;cursor:default;color:var(--mut);font-size:11px;text-transform:uppercase}.cal .o{opacity:.4}.cal .td{border:2px solid var(--teal);background:var(--soft)}
.ev{display:block;font-size:10.5px;padding:1px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;background:var(--soft);color:var(--teal)}.ev.r{background:var(--redS);color:var(--red)}.ev.a{background:var(--ambS);color:#a56d00}.ev.n{background:var(--grnS);color:var(--grn)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:var(--pri);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:99;transition:.35s;box-shadow:0 10px 30px #0004;max-width:90vw}#toast.s{transform:translate(-50%,0)}
body[data-t=dark] #toast,:root[data-t=dark] #toast{color:#04121d}
#np{position:absolute;right:28px;top:58px;width:320px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px #0a2a4333;padding:12px;display:none}#np.s{display:block;animation:in .2s}
#mb{display:none}.map{width:100%;height:auto;border-radius:14px;background:radial-gradient(circle,var(--line) 1px,transparent 1px) 0 0/22px 22px,var(--soft)}
.nd{cursor:pointer;transition:r .2s}.nd:hover{r:9}.pp{cursor:pointer;transition:.2s}.pp:hover{stroke-width:7}
@media(max-width:1100px){.c4{grid-template-columns:1fr 1fr}.m,.c3{grid-template-columns:1fr}}
@media(max-width:820px){aside{position:fixed;transform:translateX(-100%)}aside.o{transform:none;box-shadow:0 0 0 100vmax #0006}#mb{display:grid}header,#v{padding-left:14px;padding-right:14px}.c4,.c2{grid-template-columns:1fr}h1{font-size:22px}}
</style></head><body>
<aside id="sb">
<div class="logo" onclick="go('dashboard')">
<svg width="44" height="44" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19c6e6"/><stop offset="1" stop-color="#0a4f7a"/></linearGradient><clipPath id="cp"><path d="M24 4C24 4 9 20 9 30a15 15 0 0 0 30 0C39 20 24 4 24 4z"/></clipPath></defs>
<path d="M24 4C24 4 9 20 9 30a15 15 0 0 0 30 0C39 20 24 4 24 4z" fill="url(#lg)"/>

<path d="M36 8l1.4 3.2L40.6 12.6 37.4 14 36 17.2 34.6 14 31.4 12.6 34.6 11.2z" fill="#7df0ff"/></svg>

<header>

<select id="dma" onchange="toast('Zona aktif: '+this.value);render()"><option>DMA-01 Wilayah Barat</option><option>DMA-02 Sentral Niaga</option><option>DMA-03 Pesisir Timur</option><option selected>DMA-04 Kota Baru</option></select>

<button class="ib" onclick="document.documentElement.dataset.t=document.documentElement.dataset.t=='dark'?'light':'dark'" title="Mode gelap"><span class="ms">contrast</span></button>
<button class="ib" onclick="np.classList.toggle('s')"><span class="ms">notifications</span><em id="nc">3</em></button>

<div id="np"></div>
</header>
<div id="v"></div>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),sb=$('#sb'),np=$('#np');
const PG=[['dashboard','dashboard','Dashboard'],['peta','map','Peta Risiko'],['pressure','water_voc','Analisis Pressure-Flow'],['rekomendasi','build_circle','Rekomendasi Perbaikan'],['kalender','calendar_month','Kalender Inspeksi'],['peringatan','warning','Peringatan Dini'],['laporan','analytics','Laporan & Evaluasi'],['pengaturan','settings','Pengaturan']];
let cur='dashboard',S={rng:'24 Jam',risk:'Krisis & Waspada',sel:'P18',lay:{s:1,k:0,z:1},filt:'Semua',prio:'Semua',ration:true,tab:0,q:'',done:{},sched:{}};
let EV={2:['n','DMA-01 Rutin'],7:['','Audit Sensor'],9:['a','DMA-05 PRV'],14:['r','DMA-04-P18 Akustik'],15:['a','DMA-02-P05 PRV','Tim Beta'],16:['n','DMA-01 Selesai'],18:['a','DMA-03 Fitting'],21:['','DMA-06 Rutin'],25:['n','Evaluasi Q4'],30:['','DMA-01 Rutin']};
let NT=[['r','Drop tekanan DMA-04-P18 (-43%)','10:28'],['a','MNF DMA-02 melebihi batas','04:12'],['a','Defisit pasokan Intake Kali Kuto','Kemarin']];
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(t.h);t.h=setTimeout(()=>t.className='',2600)}
function sync(){const i=$('#sy .ms');i.style.transition='transform .8s';i.style.transform='rotate(360deg)';setTimeout(()=>{i.style.transition='none';i.style.transform='';const d=new Date();$('#st').textContent='Sinkronisasi: Baru saja ('+d.toTimeString().slice(0,5)+' WIB)';toast('Data telemetri berhasil disinkronkan')},800)}
function go(p){cur=p;sb.classList.remove('o');np.classList.remove('s');render();scrollTo({top:0,behavior:'smooth'})}
function nav(){$('#nv').innerHTML=PG.map(([k,i,t])=>`<a class="${k==cur?'on':''}" onclick="go('${k}')"><span class="ms">${i}</span>${t}</a>`).join('')}
function notif(){$('#nc').textContent=NT.length;$('#nc').style.display=NT.length?'':'none';np.innerHTML=`<div class="row"><b>Notifikasi</b><button class="tag" onclick="NT=[];notif();toast('Semua notifikasi dibaca')">Tandai dibaca</button></div>`+(NT.map(n=>`<div class="it ${n[0]}" onclick="go('peringatan')"><b>${n[1]}</b><br><small>${n[2]}</small></div>`).join('')||'<p class="sub">Tidak ada notifikasi baru 🎉</p>')}
const bar=(v,c='var(--teal)')=>`<div class="meter"><i style="width:0;background:${c}" data-w="${v}%"></i></div>`;
const hd=(t,s,x='',tag='Data Simulasi')=>`<div class="bar"><div><h1>${t} <span class="tag">${tag}</span></h1><p class="sub">${s}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${x}</div></div>`;
/* chart helper: pts normalized 0-1 arrays */
function line(a,w,h,c,d='',x0=30){return `<path d="${a.map((v,i)=>(i?'L':'M')+(x0+i*(w-x0-8)/(a.length-1)).toFixed(1)+' '+(h-14-v*(h-30)).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="2.4" stroke-dasharray="${d}" stroke-linejoin="round" style="stroke-dashoffset:0"/>`}
function grid(w,h,n=4){let s='';for(let i=0;i<=n;i++){const y=14+i*(h-30)/n;s+=`<line x1="30" x2="${w-8}" y1="${y}" y2="${y}" stroke="var(--line)"/>`}return s+['00:00','04:00','10:00','16:00','24:00'].map((t,i)=>`<text x="${30+i*(w-38)/4}" y="${h-1}" font-size="10" fill="var(--mut)" text-anchor="middle">${t}</text>`).join('')}
const base=[.7,.7,.72,.7,.7,.7,.72,.71,.7,.7,.71,.7],R={'24 Jam':[.7,.7,.45,.12,.3,.62,.68,.7,.7,.7,.7,.7],'3 Hari':[.7,.5,.2,.1,.4,.66,.7,.55,.3,.2,.5,.7],'7 Hari':[.7,.66,.6,.3,.15,.5,.68,.7,.6,.35,.2,.55]};
function pChart(h=200,rg=S.rng){const w=460,r=R[rg]||R['24 Jam'];return `<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00809e" stop-opacity=".25"/><stop offset="1" stop-color="#00809e" stop-opacity="0"/></linearGradient></defs>${grid(w,h)}<rect x="${w*.22}" y="14" width="${w*.16}" height="${h-30}" fill="var(--red)" opacity=".1"/><text x="${w*.3}" y="26" font-size="9" font-weight="700" fill="var(--red)" text-anchor="middle">ANOMALI</text>${line(base,w,h,'var(--mut)','4 4')}${line(r,w,h,'var(--teal)')}<circle cx="${30+3*(w-38)/11}" cy="${h-14-r[3]*(h-30)}" r="5" fill="var(--red)"><animate attributeName="r" values="4;8;4" dur="1.6s" repeatCount="indefinite"/></circle></svg>`}
function fChart(h=200){const w=460,a=[.5,.5,.55,.8,.9,.88,.7,.6,.65,.75,.6,.5],b=[.5,.48,.4,.38,.5,.62,.6,.55,.55,.62,.5,.45];return `<svg viewBox="0 0 ${w} ${h}" width="100%">${grid(w,h)}<rect x="${w*.22}" y="14" width="${w*.16}" height="${h-30}" fill="var(--red)" opacity=".1"/>${line(a,w,h,'var(--ink)')}${line(b,w,h,'var(--teal)','4 4')}</svg>`}
/* topology */
const NODES={A:[90,150,'RES','n'],B:[200,150,'','n'],C:[200,70,'S-04-A','a'],D:[330,150,'','n'],E:[430,150,'S-04-C','n'],F:[330,230,'S-04-B','r'],G:[430,230,'V-11','r'],H:[330,70,'','n'],I:[520,90,'S-04-D','n']};
const EDG=[['A','B','n'],['B','C','a'],['B','D','n'],['D','E','n'],['D','F','r'],['F','G','r'],['C','H','a'],['H','I','n'],['E','I','n'],['E','G','a']];
const col={n:'#119a64',a:'#e8a317',r:'#d32f2f'};
function topo(sel){return `<svg class="map" viewBox="0 0 600 300" id="tp">${EDG.map(([a,b,k])=>{const A=NODES[a],B=NODES[b];return `<line class="pp" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${col[k]}" stroke-width="5" stroke-linecap="round" ${k=='r'?'stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" to="-32" dur="1s" repeatCount="indefinite"/>':'>'}</line>`}).join('')}${Object.entries(NODES).map(([k,[x,y,l,s]])=>l=='RES'?`<rect x="${x-14}" y="${y-12}" width="28" height="24" rx="5" fill="#0a2a43"/><text x="${x}" y="${y+4}" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">RES</text>`:`<circle class="nd" cx="${x}" cy="${y}" r="${l?7:4}" fill="${l?'var(--card)':col[s]}" stroke="${col[s]}" stroke-width="3" onclick="pick('${k}')"/>${l?`<text x="${x}" y="${y-13}" font-size="9" font-weight="700" fill="var(--ink)" text-anchor="middle">${l}</text>`:''}`).join('')}${sel?(()=>{const [x,y]=NODES[sel];return `<circle cx="${x}" cy="${y}" r="14" fill="none" stroke="var(--teal)" stroke-width="2"><animate attributeName="r" values="10;18;10" dur="1.5s" repeatCount="indefinite"/></circle>`})():''}</svg>`}
const INFO={C:['DMA-04-P18','WASPADA','a','Drop 0.6 Bar','+2.1 L/s','0.62'],F:['DMA-04-P12','KRISIS','r','Drop 1.4 Bar','+8.2 L/s','0.89'],G:['DMA-04-V11','KRISIS','r','Drop 1.1 Bar','+5.0 L/s','0.81']};
let tpSel='F';
function pick(k){tpSel=k;const i=INFO[k]||[k=='B'?'DMA-04-P05':'Node '+k,'NORMAL','n','Drop 0.1 Bar','±0.4 L/s','0.14'];$('#tt').innerHTML=`<b style="color:var(--${i[2]=='r'?'red':i[2]=='a'?'amb':'grn'})">Anomali Terdeteksi: ${i[0]}</b> <span class="tag ${i[2]}">${i[1]}</span><div class="row"><span>Penyimpangan Tekanan</span><b>${i[3]}</b></div><div class="row"><span>Lonjakan Debit (ΔDebit)</span><b>${i[4]}</b></div><div class="row"><span>Skor Isolasi GNN</span><b>${i[5]}</b></div><button class="btn" onclick="go('peta')">Buka Detail Sensor →</button>`;$('#tpw').innerHTML=topo(k)}
/* PAGES */
